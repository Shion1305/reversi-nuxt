name: Deploy to GAE
on:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - ".github/**"
jobs:
  auto_deploy_gae:
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: "Generate .env"
        run: |
          echo "${{ secrets.ENV_CONTENTS }}" > .env
      - name: "create gcloud-credential.json"
        run: |
          mkdir ./credentials
          echo "${{ secrets.GCLOUD_CREDENTIAL }}" > ./credentials/gcloud-credential.json
      - name: "Extract branch name"
        id: branch-name
        shell: bash
        run: |
          short_ref=${GITHUB_REF#refs/*/}
          formatted_ref=$(echo "$short_ref" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "short_ref=${formatted_ref}" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - name: "Deploy to App Engine"
        id: "deploy"
        uses: "google-github-actions/deploy-appengine@v2"
        with:
          deliverables: "app.yaml"
          version: ${{ env.short_ref }}
          promote: ${{ env.short_ref =='main' }}
